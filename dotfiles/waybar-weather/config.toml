# SPDX-License-Identifier: MIT
#
# waybar-weather configuration (NixOS / KoolDots)
# Upstream: https://github.com/wneessen/waybar-weather
#
# Deployed by Home Manager from ~/nixos-config/dotfiles/waybar-weather/config.toml
# via modules/home/hyprland.nix (xdg.configFile."waybar-weather").
# This is the source of truth: edit here, then `cd ~/nixos-config && nrsl`.
#
# Consumed by the "custom/weather2" module in
# dotfiles/waybar/ModulesCustom ("exec": "waybar-weather").

## =============================================================================
## General Configuration
## =============================================================================

## Measurement system for weather data: "metric" (°C) or "imperial" (°F).
## Toggled at runtime by dotfiles/hypr/scripts/Toggle-weather-waybar-units.sh
## (also reachable from the Kool_Quick_Settings "Toggle Options" menu).
units = "metric"

## Log verbosity: DEBUG = -4, INFO = 0, WARN = 4, ERROR = 8.
loglevel = 0

## Locale used for geolocation and formatting.
## Left unset on purpose so it is derived from the environment.

## =============================================================================
## Weather Configuration
## =============================================================================
[weather]

## Weather data provider. Open-Meteo needs no API key.
provider = "open-meteo"

## Number of hours ahead to use as forecast values.
forecast_hours = 3

## Thresholds that add a "cold"/"hot" CSS class to the Waybar module.
## No stylesheet in dotfiles/waybar/style/ currently styles those two classes,
## so they are emitted but not yet coloured; the thresholds are kept here so
## adding rules later needs no config change.
cold_threshold = 2.0
hot_threshold = 30.0

## =============================================================================
## Update and Output Intervals
## =============================================================================
[intervals]

## How often weather data is refetched from the provider.
weather_update = "15m"

## How often data is pushed to Waybar.
output = "30s"

## =============================================================================
## Output Templates
## =============================================================================
[templates]

## Emit CSS classes instead of inline glyph icons, letting the Waybar
## stylesheet decide how the weather looks.
use_css_icon = false

## =============================================================================
## Geolocation Configuration
## =============================================================================
[geolocation]

## No geolocation_file / cityname_file are configured on purpose: location is
## resolved by IP (geoip), so no personal coordinates are stored in this repo.
## To pin a fixed location instead, set both of these:
##   geolocation_file = "/home/<user>/.config/waybar-weather/geolocation"
##   cityname_file    = "/home/<user>/.config/waybar-weather/cityname"
## Each file holds a single line, e.g. "3.4516,-76.5320" and "Cali, Colombia".

## GPSD is unused on this setup; disable it to skip the probe on startup.
disable_gpsd = true
