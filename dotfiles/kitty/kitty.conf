# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/

font_family FantasqueSansM Nerd Font Mono
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto
allow_remote_control yes

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

# ***************** aqui pondré mis configs *******************
map alt+h send_key left
map alt+j send_key down
map alt+k send_key up
map alt+l send_key right   

# Scroll línea a línea (como k/j en vim)
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down

# Scroll por página (como Ctrl+U / Ctrl+D en vim)
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down   

# Navegar de palabra en palabra
map alt+w send_text all \x1bf
map alt+b send_text all \x1bb   

# *************************************************************

# foreground/background/cursor are set by the active theme
include /home/jupamohi/.config/kitty/kitty-themes/3024_Night.conf
